name: retrieval-gpu

# GPU side of the retrieval stack. Both services bind to loopback only: the nyan
# client runs on this host, so no mesh exposure and no service auth is needed.
# Rerank goes through vLLM because TEI cannot serve a causal-LM scorer like
# Qwen3-Reranker (its score is the yes/no logit pair, not a classifier head).

services:
  llama-embed:
    # TEI cuda-1.9 (FlashQwen2) hangs on this GPU: it loads the model, then burns
    # one CPU core at 100% without binding the port. llama.cpp serves the same
    # model from Jina's official BF16 GGUF with --pooling last.
    # Pinned by digest to the build measured on this GPU: llama.cpp revision 1d88cb0 (built 2026-10-20). The startup
    # flags below are version-sensitive (`--pooling last`, the GGUF alias), and `server-cuda` is a moving tag, so a
    # `pull` would silently replace the server. Upgrading is an explicit edit of this line.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:4ca0d26c2d3032bd0c269599b94457911d379db2c3da0748df742d27634c792f
    container_name: retrieval-llama-embed
    restart: unless-stopped
    command:
      - -m
      - /models/gguf/jina-code-embeddings-1.5b-BF16.gguf
      - --alias
      - jina-code-embeddings-1.5b
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - "8192"
      - --batch-size
      - "4096"
      - --ubatch-size
      - "2048"
      - --n-gpu-layers
      - "99"
      - --parallel
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "80"
    ports:
      - 127.0.0.1:8090:80
    volumes:
      # `MODELS_DIR` names the host directory holding `gguf/` and `Qwen/`. Without it a host that keeps the weights
      # elsewhere gets an empty directory inside the container, and both services fail while the compose file says
      # nothing was wrong.
      - "${MODELS_DIR:-/home/blxze/models}:/models:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/80\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  vllm-rerank:
    # Pinned by digest: vLLM 0.32.0, which is the server the `--runner=pooling` flags and the
    # `classifier_from_token` override were verified against. vLLM renames these fields between releases, so `latest`
    # would restart-loop on a new one instead of failing here.
    image: vllm/vllm-openai:latest@sha256:c11e525d1416ec6df92847d9a45319b8dc3b23c348a0c7a4dcac009628a1063f
    container_name: retrieval-vllm-rerank
    restart: unless-stopped
    # Qwen3-Reranker is a causal LM that scores by the "no"/"yes" token pair, so
    # vLLM needs the sequence-classification override (its documented route for
    # the original Qwen3-Reranker) rather than a plain cross-encoder head.
    command:
      - /models/Qwen/Qwen3-Reranker-0.6B
      - --runner=pooling
      - --hf-overrides={"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}
      - --served-model-name=qwen3-reranker-0.6b
      - --port=8091
      - --dtype=float16
      - --max-model-len=4096
      - --gpu-memory-utilization=0.32
      - --max-num-seqs=8
    ports:
      - 127.0.0.1:8091:8091
    volumes:
      - "${MODELS_DIR:-/home/blxze/models}:/models:ro"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8091\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20mb"
        max-file: "3"
