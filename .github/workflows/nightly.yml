name: Nyan nightly deep verification

# Full suites, on the self-hosted host. Nothing here is on a pull-request path, so a queue on this host cannot delay a
# pull request. The matrices stay below the host's six slots: six vitest pools on six cores measured at load 17-26 and
# produced timing flakes, so the widths here are 2 + 2 + 1 = 5 live jobs.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nyan-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.19.0'
  BUN_VERSION: '1.4.2'
  NYAN_OFFLINE: '1'

jobs:
  prepare:
    name: Prepare workspace and expand every package
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 30
    outputs:
      node_shards: ${{ steps.shards.outputs.node_shards }}
      bun_shards: ${{ steps.shards.outputs.bun_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          model-data: 'true'

      - name: Build offline
        run: npm run build:offline

      - name: Pack the workspace
        run: |
          set -euo pipefail
          shopt -s nullglob
          tar -cf - node_modules packages/*/node_modules packages/*/dist .ci/model-data.lock.json | gzip -1 > nyan-workspace.tar.gz
          ls -lh nyan-workspace.tar.gz

      - name: Upload the workspace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-workspace-${{ github.sha }}
          path: nyan-workspace.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Select every package
        # No changed files in a scheduled run, so ci-impact selects the full suite.
        id: impact
        run: node scripts/ci-impact.mjs

      - name: Expand test shards
        id: shards
        env:
          NODE_PACKAGES: ${{ steps.impact.outputs.node_packages }}
          BUN_PACKAGES: ${{ steps.impact.outputs.bun_packages }}
        run: node scripts/ci-shards.mjs

  node-tests:
    name: Node tests (${{ matrix.name }})
    needs: prepare
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.node_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure fd and ripgrep
        run: |
          echo "image before: rg=$(command -v rg || echo missing) fd=$(command -v fd || echo missing) fdfind=$(command -v fdfind || echo missing)"
          if ! command -v rg >/dev/null || { ! command -v fd >/dev/null && ! command -v fdfind >/dev/null; }; then
            sudo apt-get update
            sudo apt-get install -y ripgrep fd-find
          fi

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          install: 'false'
          model-data: 'true'

      - name: Run root script tests
        if: matrix.package == 'root'
        run: npm run test:scripts

      - name: Run package tests
        if: matrix.package != 'root' && matrix.shard == ''
        run: npm --workspace "packages/${{ matrix.package }}" test

      - name: Run a shard of package tests
        if: matrix.shard != ''
        working-directory: packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          node ../../node_modules/vitest/vitest.mjs --run "--shard=$SHARD"
          if [ "$PACKAGE" = "durable" ]; then
            node scripts/test-without-document-retention.mjs "--shard=$SHARD"
          fi

  bun-tests:
    name: Bun tests (${{ matrix.name }})
    needs: prepare
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.bun_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure fd and ripgrep
        run: |
          echo "image before: rg=$(command -v rg || echo missing) fd=$(command -v fd || echo missing) fdfind=$(command -v fdfind || echo missing)"
          if ! command -v rg >/dev/null || { ! command -v fd >/dev/null && ! command -v fdfind >/dev/null; }; then
            sudo apt-get update
            sudo apt-get install -y ripgrep fd-find
          fi

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          bun: 'true'
          install: 'false'
          model-data: 'true'

      - name: Run Bun package tests
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD" ]; then
            node scripts/test-bun.mjs "$PACKAGE" "--shard=$SHARD"
          else
            node scripts/test-bun.mjs "$PACKAGE"
          fi

      - name: Run durable retention tests under Bun
        if: matrix.package == 'durable'
        env:
          NYAN_DURABLE_DOCUMENT_RETENTION_MS: '0'
          PACKAGE: durable
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD" ]; then
            node scripts/test-bun.mjs "$PACKAGE" "--shard=$SHARD"
          else
            node scripts/test-bun.mjs "$PACKAGE"
          fi

  deep:
    name: Protocol fuzz and mutation testing
    # Runs in parallel with the suites: it needs only the workspace, not their results.
    needs: prepare
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          install: 'false'
          model-data: 'true'

      - name: Run deterministic protocol fuzz harness
        env:
          FUZZ_RUNS: '10000'
          FUZZ_SEED: '20261017'
        run: npm run test:fuzz:protocol

      - name: Run protocol mutation testing
        run: npm run test:mutation

      - name: Upload deep-testing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-nightly-deep-testing-${{ github.sha }}
          path: |
            .artifacts/fuzz
            .artifacts/stryker
          if-no-files-found: ignore
          retention-days: 14
