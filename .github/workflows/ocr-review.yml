# OCR review — AI code review on every PR.
#
# Flow: PR opened/synchronize/reopened -> build base..head diff -> POST to
# dev-02 `ocr-dispatch` -> render Markdown -> create/update ONE PR comment
# tagged <!-- ocr-review -->.
#
# Why self-hosted: the dispatch service lives on nyan-dev-02 and its UFW only
# admits tailscale0, so a GitHub-hosted runner cannot reach it. The
# self-hosted dev-01 runner can. Fork PRs must NOT run on self-hosted (those
# users hold NOPASSWD sudo and the docker group), so they are skipped with a
# note instead — same trust split as ci.yml.
#
# Review effort is "medium". Measured on a 6-file diff against effort=low:
# 14 findings vs 8, at ~2.6x the tokens and ~30 minutes instead of ~7. The extra
# findings included a real user-visible regression that low missed.
#
# No timeout is set on the review itself: a review runs as long as the diff needs.
# Earlier this workflow capped the job at 50 min, dispatch at 40 min and nginx at
# 2500s, which silently discarded long runs (a 32-min effort=medium session has
# already been observed on dev-02). The only ceiling left is GitHub's own hard
# limit: jobs.timeout-minutes maxes out at 360 minutes, and omitting the key
# falls back to that same 360. So the workflow explicitly declares 360 — the
# largest legal value — and nginx's 24h backstop can never fire first (it is the
# client that runs out of clock).
#
# OCR reports status=partial when some files could not be reviewed; the rendered
# comment then carries a warning naming them, so a partial run is never mistaken
# for a clean one.
#
# Secrets needed (repo Settings -> Secrets and variables -> Actions):
#   OCR_DISPATCH_URL    default http://100.80.19.12:50007/ocr  (tailnet + nginx)
#   OCR_DISPATCH_TOKEN  must equal /etc/ocr-dispatch.token on dev-02
#
# The dispatch server holds the CPA key. The runner only ships the diff and
# receives the rendered comment; the model credential never leaves dev-02.

name: OCR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review (OCR)
    # Compare repository full names rather than head.repo.fork: this repository
    # is itself a fork, so `fork` is true for every PR. Mirrors ci.yml.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","repo-nyan"]') || 'ubuntu-latest' }}
    # 360 is GitHub's hard maximum for jobs.timeout-minutes; there is no way to
    # express "unlimited", and omitting the key means the same 360.
    timeout-minutes: 360
    steps:
      - name: Guard — fork PRs cannot reach the dispatch service
        id: guard
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR: skipping OCR review (dispatch is tailnet-only)."
          fi

      - name: Checkout PR head with base history
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build PR diff
        if: steps.guard.outputs.skip != 'true'
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # `set -e` stays off: the two-dot fallback below is deliberate. That means
          # every command whose failure should abort the step has to be checked by
          # hand — otherwise a failed fetch leaves an empty diff, the review steps
          # are skipped as "nothing to review", and the job still reports success.
          set -uo pipefail
          DIFF="$RUNNER_TEMP/pr.diff"
          if ! git fetch --no-tags --quiet origin "$BASE" "$HEAD"; then
            echo "::error::git fetch failed for $BASE / $HEAD"
            exit 1
          fi
          # Three-dot (merge-base) matches what GitHub shows in "Files changed".
          if ! git diff "$BASE"..."$HEAD" > "$DIFF" 2>/dev/null; then
            if ! git diff "$BASE" "$HEAD" > "$DIFF"; then
              echo "::error::could not diff $BASE against $HEAD"
              exit 1
            fi
          fi
          echo "lines=$(wc -l < "$DIFF")" >> "$GITHUB_OUTPUT"
          [ -s "$DIFF" ] || echo "empty=true" >> "$GITHUB_OUTPUT"

      - name: Request review from ocr-dispatch
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        env:
          URL: ${{ secrets.OCR_DISPATCH_URL || 'http://100.80.19.12:50007/ocr' }}
          TOKEN: ${{ secrets.OCR_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          diff = open(os.path.join(os.environ["RUNNER_TEMP"], "pr.diff"), encoding='utf-8').read()
          payload = json.dumps({
              "repo": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "base_sha": os.environ["BASE"],
              "diff": diff,
              "model": "deepseek-flash",
              "effort": "medium",
              # 0 = review 不限时;能跑多久由本作业的 timeout-minutes 决定。
              "timeout_minutes": 0,
          }).encode()
          req = urllib.request.Request(
              os.environ["URL"].rstrip('/') + '/review',
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["TOKEN"],
              },
              method='POST')
          try:
              with urllib.request.urlopen(req, timeout=None) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              data = {"ok": False, "error": "HTTP %s: %s" % (exc.code, exc.read(200)[:200])}
          except Exception as exc:  # noqa: BLE001
              data = {"ok": False, "error": "dispatch unreachable: %s" % exc}

          if data.get("ok"):
              body = data.get("comment") or ""
          else:
              body = ("<!-- ocr-review -->\n\n> ⚠️ OCR review 未能完成：%s\n"
                      "\n<sub>可重跑本 workflow，或检查 dev-02 的 `ocr-dispatch`。</sub>\n"
                      % data.get("error", "unknown"))
          open(os.path.join(os.environ["RUNNER_TEMP"], "ocr_comment.md"), 'w', encoding='utf-8').write(body)
          print("dispatch ok=%s error=%s" % (data.get("ok"), data.get("error")))
          PY

      - name: Post or update the PR comment
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ocr-review -->';
            const path = require('path');
            const body = fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, 'ocr_comment.md'), 'utf8');
            if (!body.includes(marker)) {
              core.warning('rendered comment lacks the marker; refusing to post');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c =>
              c.body && c.body.includes(marker) &&
              c.user && c.user.type === 'Bot');
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
              core.info(`updated comment ${mine.id}`);
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
              core.info('created OCR review comment');
            }
