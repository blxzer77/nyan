name: Release

# Publishes the public packages to npm and creates a GitHub release with standalone Bun executables
# (scripts/build-binaries.mjs) when a release tag is pushed.
#
#   npm run version:set -- 1.2.0     bump every package and the lockfiles, date the changelog's Unreleased entries
#   git commit -am "Release 1.2.0" && git tag nyan-v1.2.0 && git push --follow-tags
#
# Release tags are nyan-vX.Y.Z. The plain vX.Y.Z names belong to Pi: this repository inherited its tags, and v1.0.0 and
# v1.1.0 already point at Pi releases. The tag version must equal the package version. A version with a pre-release suffix publishes under the `next` dist-tag.
# A re-run skips versions that are already on the registry.
#
# The verify job packs one artifact set and every later job downloads those exact bytes; the publish job never rebuilds,
# so what npm receives is what the smoke tests ran against.

on:
  push:
    tags: ["nyan-v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack every package without publishing
        type: boolean
        default: true

concurrency:
  group: nyan-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.4.2'
  NYAN_OFFLINE: '1'

jobs:
  verify:
    name: Verify and pack
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          model-data: 'true'

      - name: Changelog has the release
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#nyan-v}"
          if [[ "$version" == *-* ]]; then
            echo "Pre-release $version: the changelog is dated at the final release."
          else
            node scripts/changelog-release.mjs --check "$version"
          fi

      - name: Build offline
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Pack verified packages
        # --skip-build reuses the dist/ that the offline build above produced, and --force replaces any stale artifact set
        # so the manifest always describes the bytes that were just tested.
        run: node scripts/pack-packages.mjs --out .artifacts/packages --force --skip-build

      - name: Upload verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-packages
          path: .artifacts/packages
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native prebuilds
    uses: ./.github/workflows/native.yml

  binaries:
    name: Bun binaries
    needs: native
    runs-on: [self-hosted, Linux, X64, repo-nyan]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          bun: 'true'
          model-data: 'true'

      - name: Download Linux native prebuilds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: native-linux-*
          path: packages/tui/native/linux/prebuilds
          merge-multiple: true

      - name: Download macOS prebuilds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-darwin-universal
          path: packages/tui/native/darwin/prebuilds

      - name: Download Windows prebuilds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-win32-universal
          path: packages/tui/native/win32/prebuilds

      - name: Build offline
        run: npm run build:offline

      - name: Compile binaries
        run: node scripts/build-binaries.mjs --out release-assets

      # A Sigstore-signed statement that these files were built by this workflow from this commit. The smoke and
      # publish jobs download the same bytes, so what is attested is what is released.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-binaries
          path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  binary-smoke:
    name: Smoke ${{ matrix.platform }}
    needs: binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: [self-hosted, Linux, X64, repo-nyan], platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: windows-latest, platform: windows-x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nyan-binaries
          path: release-assets

      - name: Extract
        id: extract
        shell: bash
        run: |
          mkdir -p extracted
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            export ARCHIVE_PATH="$(cygpath -w "release-assets/nyan-${{ matrix.platform }}.zip")"
            export DESTINATION_PATH="$(cygpath -w extracted/nyan)"
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
            echo "binary=extracted/nyan/nyan.exe" >> "${GITHUB_OUTPUT}"
          else
            tar -xzf "release-assets/nyan-${{ matrix.platform }}.tar.gz" -C extracted
            echo "binary=extracted/nyan/nyan" >> "${GITHUB_OUTPUT}"
          fi

      - name: Smoke-test binary
        shell: bash
        run: |
          "${{ steps.extract.outputs.binary }}" --help
          "${{ steps.extract.outputs.binary }}" --version
          node scripts/smoke-test-codemode-binary.mjs "${{ steps.extract.outputs.binary }}"

      - name: Smoke-test self-update
        shell: bash
        run: node scripts/smoke-test-binary-update.mjs "${{ steps.extract.outputs.binary }}" "${{ matrix.platform }}"

  publish:
    name: Publish verified artifacts
    needs: [verify, native, binary-smoke]
    # npm verifies the runner environment when it accepts a provenance bundle and rejects a
    # `self-hosted` runner: "Only 'github-hosted' runners are supported when publishing with
    # provenance". This job therefore stays on a GitHub-hosted runner while the build jobs use the
    # self-hosted one. `actions/attest-build-provenance` in the binaries job is a GitHub service and
    # is not affected.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download verified packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nyan-packages
          path: release-packages

      - name: Verify the artifact set was packed from this commit
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const { source } = JSON.parse(readFileSync("release-packages/manifest.json", "utf8"));
          if (source?.dirty) {
            console.error("Refusing to publish an artifact set that was packed from a dirty tree");
            process.exit(1);
          }
          if (source?.commit !== process.env.GITHUB_SHA) {
            console.error(`Artifact set is from ${source?.commit}, expected ${process.env.GITHUB_SHA}`);
            process.exit(1);
          }
          console.log(`Artifact set was packed from ${source.commit}`);
          '

      - name: Publish exact verified package artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          args=(--manifest release-packages/manifest.json)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#nyan-v}"
            args+=(--expect-version "$version")
            [[ "$version" == *-* ]] && args+=(--tag next)
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/publish-packages.mjs "${args[@]}"

      - name: Download binaries
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nyan-binaries
          path: release-assets

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          # The tag is nyan-vX.Y.Z; only a suffix on the version itself (1.2.0-rc.1) makes a pre-release.
          [[ "${GITHUB_REF_NAME#nyan-v}" == *-* ]] && prerelease=(--prerelease)
          # A re-run finds the release already created and replaces its binaries.
          gh release create "${GITHUB_REF_NAME}" --generate-notes "${prerelease[@]}" release-assets/* \
            || gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
