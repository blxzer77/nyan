name: Release

# Publishes the public packages to npm when a release tag is pushed.
#
#   npm run version:set -- 1.2.0     bump every package and the lockfiles
#   git commit -am "Release 1.2.0" && git tag nyan-v1.2.0 && git push --follow-tags
#
# Release tags are nyan-vX.Y.Z. The plain vX.Y.Z names belong to Pi: this repository inherited its tags, and v1.0.0 and
# v1.1.0 already point at Pi releases. The tag version must equal the package version. A version with a pre-release suffix publishes under the `next` dist-tag.
# A re-run skips versions that are already on the registry.

on:
  push:
    tags: ["nyan-v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack every package without publishing
        type: boolean
        default: true

concurrency:
  group: nyan-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  native:
    name: Native prebuilds
    uses: ./.github/workflows/native.yml

  publish:
    name: Publish
    needs: [verify, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download native prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: packages/tui/native/linux/prebuilds
          merge-multiple: true

      - name: Download macOS prebuilds
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-universal
          path: packages/tui/native/darwin/prebuilds

      - name: Download Windows prebuilds
        uses: actions/download-artifact@v4
        with:
          name: native-win32-universal
          path: packages/tui/native/win32/prebuilds

      - name: Build
        run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#nyan-v}"
            args=(--expect-version "$version")
            [[ "$version" == *-* ]] && args+=(--tag next)
          else
            args=()
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/publish-packages.mjs "${args[@]}"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" --generate-notes "${prerelease[@]}" || gh release view "${GITHUB_REF_NAME}"
