name: Model Catalog

on:
  pull_request:
    paths:
      - '.github/workflows/model-catalog.yml'
      - '.gitignore'
      - 'package.json'
      - 'packages/ai/**'
      - 'scripts/model-catalog-protocol.ts'
      - 'scripts/publish-model-catalog.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model catalog JSON
        run: npm run generate:model-catalog

      - name: Validate model catalog JSON
        run: npm run check:model-catalog
