name: Nyan quality gate

# Pull-request work runs on GitHub-hosted runners only. The account allows 20 concurrent jobs (measured with a 40-job
# probe), which absorbs the test fan-out. Self-hosted runners are absent here on purpose: their six slots are shared by
# every open pull request, and a job queued behind other sessions' work costs more than the work itself.
#
# Shape: policy selects packages and expands the large suites into shards; prepare installs and builds once and packs
# the workspace; every test job unpacks that archive instead of installing again. A fork pull request runs the same
# jobs as an internal one, because no job here needs a credential or a self-hosted host.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: nyan-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.19.0'
  BUN_VERSION: '1.4.2'
  NYAN_OFFLINE: '1'

jobs:
  policy:
    name: Policy and impact
    # Imports Node built-ins only (ci-impact.mjs, ci-shards.mjs), so it needs no install.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.impact.outputs.full_suite }}
      node_packages: ${{ steps.impact.outputs.node_packages }}
      bun_packages: ${{ steps.impact.outputs.bun_packages }}
      node_shards: ${{ steps.shards.outputs.node_shards }}
      bun_shards: ${{ steps.shards.outputs.bun_shards }}
      risk: ${{ steps.impact.outputs.risk }}
      deep_required: ${{ steps.impact.outputs.deep_required }}
      windows_required: ${{ steps.impact.outputs.windows_required }}
      mcp_required: ${{ steps.impact.outputs.mcp_required }}
      internal: ${{ steps.split.outputs.internal }}
      self_hosted_shards: ${{ steps.split.outputs.self_hosted_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Decide the runner split
        # Code from this repository and from `main` may use the self-hosted host; a fork pull request may not, because
        # those users hold NOPASSWD sudo and the docker group on it. `pullRequest.selfHostedShards` in policy.json
        # sets how many of the slowest shards use the six self-hosted slots; both pools then work at the same time.
        id: split
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shards=$(node --input-type=commonjs -e "process.stdout.write(String(require('./.github/quality/policy.json').pullRequest.selfHostedShards ?? 0))")
          internal=false
          if [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = merge_group ]; then
            internal=true
          elif [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            internal=true
          fi
          echo "internal=$internal" >> "$GITHUB_OUTPUT"
          echo "self_hosted_shards=$shards" >> "$GITHUB_OUTPUT"
          echo "trusted source: $internal; self-hosted shards: $shards"

      - name: Compute change impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-impact.mjs

      - name: Expand test shards
        id: shards
        env:
          NODE_PACKAGES: ${{ steps.impact.outputs.node_packages }}
          BUN_PACKAGES: ${{ steps.impact.outputs.bun_packages }}
          INTERNAL_PR: ${{ steps.split.outputs.internal }}
          SELF_HOSTED_SHARDS: ${{ steps.split.outputs.self_hosted_shards }}
        run: node scripts/ci-shards.mjs

      - name: Show policy
        run: node --input-type=commonjs -e "console.log(JSON.stringify(require('./.github/quality/policy.json'), null, 2))"

  prepare:
    name: Prepare workspace
    # The only install and build of the run. Packs node_modules, the built packages and the model-data lock into one
    # archive; every test job restores it with `restore-workspace` instead of installing again.
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the static fd and ripgrep
        # These go into the workspace archive so no test job installs them with apt (see
        # scripts/fetch-ci-tools.mjs). The archive must contain them: restore-workspace puts .ci/bin on PATH.
        uses: ./.github/actions/ci-tools

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          model-data: 'true'

      - name: Build offline
        run: npm run build:offline

      - name: Pack the workspace
        run: |
          set -euo pipefail
          # npm workspaces nest a dependency whose version conflicts with the hoisted one: `openai` lives in
          # packages/ai/node_modules, not in the root. Pack every nested node_modules, or a restored job cannot resolve it.
          # nullglob drops a pattern with no match instead of failing, since not every package nests anything.
          shopt -s nullglob
          tar -cf - node_modules packages/*/node_modules packages/*/dist .ci/bin .ci/model-data.lock.json | gzip -1 > nyan-workspace.tar.gz
          ls -lh nyan-workspace.tar.gz

      - name: Upload the workspace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-workspace-${{ github.sha }}
          path: nyan-workspace.tar.gz
          # The archive is already compressed; store it as-is instead of wrapping it in a second compressed archive.
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  static:
    name: Static checks
    # `npm run check` reads `packages/*/src` only, so this job installs its own dependencies and does not wait for
    # `prepare`: an uncached install is cheaper than queueing behind the build, and the check reports even if the build
    # fails. It also runs validate-workflows, so the workflow files are checked here.
    needs: [policy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure fd and ripgrep
        # This job installs its own dependencies instead of restoring the workspace archive, so it fetches the tools
        # itself. Every other job gets them from the archive (see .github/actions/restore-workspace).
        uses: ./.github/actions/ci-tools

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          model-data: 'true'

      - name: Check
        run: npm run check

  node-tests:
    name: Node tests (${{ matrix.name }})
    needs: [policy, prepare]
    # Each job names its own pool in the matrix, so the hosted and self-hosted runners work on the same run.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Both matrices together can exceed the measured limit of 20 live jobs; GitHub then queues the rest, which is
      # safe. These values are the width the matrices are allowed, not a promise that all of them run at once.
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.node_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          install: 'false'
          model-data: 'true'

      - name: Run root script tests
        if: matrix.package == 'root'
        run: npm run test:scripts

      - name: Run package tests
        if: matrix.package != 'root' && matrix.shard == ''
        run: npm --workspace "packages/${{ matrix.package }}" test

      - name: Run a shard of package tests
        # Direct `node` calls, not `npm`: npm swallows `--shard=` before the script sees it (measured), so the shard would
        # silently run every file. durable runs its suite twice, and both passes take the same shard.
        if: matrix.shard != ''
        working-directory: packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          node ../../node_modules/vitest/vitest.mjs --run "--shard=$SHARD"
          if [ "$PACKAGE" = "durable" ]; then
            node scripts/test-without-document-retention.mjs "--shard=$SHARD"
          fi

  bun-tests:
    name: Bun tests (${{ matrix.name }})
    needs: [policy, prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.bun_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          bun: 'true'
          install: 'false'
          model-data: 'true'

      - name: Run Bun package tests
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD" ]; then
            node scripts/test-bun.mjs "$PACKAGE" "--shard=$SHARD"
          else
            node scripts/test-bun.mjs "$PACKAGE"
          fi

      - name: Run durable retention tests under Bun
        if: matrix.package == 'durable'
        env:
          NYAN_DURABLE_DOCUMENT_RETENTION_MS: '0'
          PACKAGE: durable
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -n "$SHARD" ]; then
            node scripts/test-bun.mjs "$PACKAGE" "--shard=$SHARD"
          else
            node scripts/test-bun.mjs "$PACKAGE"
          fi

  windows-smoke:
    name: Windows build and check
    needs: [policy, prepare]
    # There is no local Windows machine any more, so this job is the only Windows coverage. It runs when the impact
    # classifier selects a path that can behave differently there; the gate treats a skip as the intended outcome,
    # and a skip when the classifier did ask for it is a failure.
    if: needs.policy.outputs.windows_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        shell: bash
        run: |
          if [ "$(npm --version)" != "${{ env.NPM_VERSION }}" ]; then
            npm install --global "npm@${{ env.NPM_VERSION }}"
          fi
          npm --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore fixed model-data snapshot
        shell: pwsh
        run: node scripts/ci-model-data.mjs --restore

      - name: Build offline
        run: npm run build:offline

      - name: Check
        run: npm run check

  mcp-conformance:
    name: MCP conformance
    needs: [policy, prepare]
    if: needs.policy.outputs.mcp_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          model-data: 'true'

      - name: MCP conformance
        run: npm run test:mcp-conformance

  supply-chain:
    name: Supply chain and secrets
    # Self-hosted was rejected here by measurement: a job queued behind other sessions added minutes to the critical path.
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: |
          if [ "$(npm --version)" != "${{ env.NPM_VERSION }}" ]; then
            npm install --global "npm@${{ env.NPM_VERSION }}"
          fi
          npm --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Gitleaks
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -x -C "$scan_dir"
          docker run --rm -v "$scan_dir:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --no-git --source /repo --config /repo/.gitleaks.toml --no-banner --redact

      - name: npm audit
        run: node scripts/npm-audit.mjs

      - name: Verify npm registry signatures
        run: npm audit signatures --omit=dev

      - name: Trivy filesystem scan
        # Runs on pull requests too, so a dependency with a known vulnerability is caught before it reaches main. Pull
        # requests block only on CRITICAL, so a HIGH disclosed overnight does not turn every open pull request red; main
        # and the nightly scan block on HIGH as well.
        #
        # The examples' own lockfiles are skipped: they are pinned at 1.1.0 while the package is at 1.3.0 and take no
        # part in a build, so they report dependency trees nothing here installs. `.trivyignore.yaml` carries the
        # accepted risks.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.68.2 fs
          --scanners vuln,secret,misconfig
          --skip-dirs /repo/node_modules --skip-dirs /repo/.git
          --skip-files '/repo/packages/coding-agent/examples/**/package-lock.json'
          --ignorefile /repo/.trivyignore.yaml
          --exit-code 1
          --severity ${{ github.event_name == 'pull_request' && 'CRITICAL' || 'HIGH,CRITICAL' }}
          /repo

  deep-gate:
    name: Deep verification
    # Only what the sharded matrices do not already run: the protocol fuzz and the mutation run. The package suites are
    # covered by node-tests and bun-tests in the same run, so repeating them here only added time.
    needs: [policy, prepare]
    if: needs.policy.outputs.deep_required == 'true' && needs.policy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore workspace
        id: restore
        # The download takes about 15 s. One of sixty stalled for over fifteen minutes with the process idle, and a stalled
        # download cannot be told from a slow one, so bound it and try once more instead of holding the job.
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 3
        continue-on-error: true

      - name: Restore workspace (retry)
        if: steps.restore.outcome != 'success'
        uses: ./.github/actions/restore-workspace
        timeout-minutes: 5

      - name: Setup Nyan
        uses: ./.github/actions/setup-nyan
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun: 'false'
          install: 'false'
          model-data: 'true'

      - name: Run deterministic protocol fuzz harness
        env:
          FUZZ_RUNS: '5000'
          FUZZ_SEED: '20261017'
        run: npm run test:fuzz:protocol

      - name: Restore the mutation incremental file
        # Stryker re-runs only the mutants affected by what changed, but it stores that in
        # .artifacts/stryker/protocol-incremental.json, which a fresh runner never has: without this the job
        # mutated the whole of cbor/** on every run. Measured locally: 2 m 44 s cold against 6.7 s warm.
        #
        # The file cannot hide a regression: changing a test file re-runs everything (2 m 31 s measured), and
        # deleting a test raised the survivor count from 88 to 89. That is why a pull request restores but never
        # saves, and why only main writes it.
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .artifacts/stryker/protocol-incremental.json
          key: stryker-incremental-${{ hashFiles('packages/protocol/src/cbor/**/*.ts', 'packages/protocol/test/cbor/**/*.ts') }}
          restore-keys: |
            stryker-incremental-

      - name: Run protocol mutation testing
        run: npm run test:mutation

      - name: Save the mutation incremental file
        # Only a push to main writes it: a per-pull-request key would be scoped to a ref nobody reuses, which is
        # what filled the cache quota before.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .artifacts/stryker/protocol-incremental.json
          key: stryker-incremental-${{ hashFiles('packages/protocol/src/cbor/**/*.ts', 'packages/protocol/test/cbor/**/*.ts') }}

      - name: Upload deep-testing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyan-deep-testing-${{ github.sha }}
          path: |
            .artifacts/fuzz
            .artifacts/stryker
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Merge gate
    needs: [policy, prepare, static, node-tests, bun-tests, windows-smoke, mcp-conformance, supply-chain, deep-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Evaluate required results
        # The required list is `.github/quality/policy.json` plus the impact flags, not a second copy here: this file
        # used to repeat the names, and a renamed job then either stopped being required or blocked a merge forever.
        # A job that is required but missing from CI_GATE_RESULTS fails the gate, so deleting a job here without
        # updating the policy is caught; an impact output the policy job did not produce arrives empty and is rejected
        # too, which is what keeps a failed policy job from silently cancelling the conditional checks.
        env:
          CI_GATE_RESULTS: >-
            {"policy":"${{ needs.policy.result }}","prepare":"${{ needs.prepare.result }}","static":"${{ needs.static.result }}","node-tests":"${{ needs.node-tests.result }}","bun-tests":"${{ needs.bun-tests.result }}","windows-smoke":"${{ needs.windows-smoke.result }}","mcp-conformance":"${{ needs.mcp-conformance.result }}","supply-chain":"${{ needs.supply-chain.result }}","deep-gate":"${{ needs.deep-gate.result }}"}
          CI_GATE_IMPACT: >-
            {"windows_required":"${{ needs.policy.outputs.windows_required }}","mcp_required":"${{ needs.policy.outputs.mcp_required }}","deep_required":"${{ needs.policy.outputs.deep_required }}"}
        run: node scripts/ci-gate.mjs
