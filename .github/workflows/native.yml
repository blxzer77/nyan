name: Native prebuilds

# Builds the terminal helper modules on the platform each one targets. The release workflow calls this and ships the
# fresh binaries; run it by hand to check that the committed prebuilds still match the sources.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: [self-hosted, Linux, X64, repo-nyan], platform: linux, arch: x64, script: build:native:linux }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, script: build:native:linux }
          # The macOS script cross-compiles both architectures with clang on one runner.
          - { runner: macos-15, platform: darwin, arch: universal, script: build:native:darwin }
          # The Windows script builds x64 and arm64 on one runner.
          - { runner: windows-latest, platform: win32, arch: universal, script: build:native:win32 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          bash .github/scripts/apt-install.sh libxcb1-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm --prefix packages/tui run ${{ matrix.script }}

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/tui/native/${{ matrix.platform }}/prebuilds
          if-no-files-found: error
