name: Native prebuilds

# Builds the terminal helper modules on the platform each one targets. The release workflow calls this and ships the
# fresh binaries; run it by hand to check that the committed prebuilds still match the sources.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, arch: x64, script: build:native:linux }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, script: build:native:linux }
          # The macOS script cross-compiles both architectures with clang on one runner.
          - { runner: macos-15, platform: darwin, arch: universal, script: build:native:darwin }
          # The Windows script builds x64 and arm64 on one runner.
          - { runner: windows-latest, platform: win32, arch: universal, script: build:native:win32 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies on hosted runners
        if: matrix.platform == 'linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm --prefix packages/tui run ${{ matrix.script }}

      - name: Upload prebuilds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/tui/native/${{ matrix.platform }}/prebuilds
          if-no-files-found: error
